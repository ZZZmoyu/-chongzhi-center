<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>充值中心</title><style>body{margin:0;font-family:-apple-system,"Microsoft YaHei";background:#f5f7fb;color:#182230}header{background:#111827;color:#fff;padding:16px 6%;display:flex;justify-content:space-between}.logo{font-size:21px;font-weight:bold}.logo b{color:#60a5fa}button{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;margin-left:5px}header button{background:none}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}section{display:none}section.active{display:block}.hero{background:#172c4a;color:#fff;text-align:center;padding:55px 15px}.cards,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card,.panel{background:#fff;padding:22px;border-radius:15px;box-shadow:0 5px 20px #0001}.price{font-size:24px;color:#2563eb;font-weight:bold;margin:18px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5dce7;border-radius:8px;margin:6px 0 14px}label{font-weight:bold}.msg,.notice{padding:12px;border-radius:8px;margin-top:12px}.notice{background:#eff6ff;color:#526176;font-size:13px}.msg{display:none}.ok{background:#ecfdf5;color:#166534}.err{background:#fef2f2;color:#991b1b}.stats{grid-template-columns:repeat(3,1fr)}.stat b{display:block;font-size:24px;color:#2563eb;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 5px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){.cards,.stats{grid-template-columns:1fr}table{font-size:11px}}</style><body>
<header><div class="logo">充值<b>中心</b></div><nav><button onclick="go('home')">首页</button><button onclick="go('order')">下单</button><button onclick="admin()">后台</button></nav></header>
<section id="home" class="active"><div class="hero"><h1>ChatGPT 会员服务</h1><p>套餐清晰 · 人工确认 · 订单管理</p></div><div class="wrap"><h2>选择套餐</h2><div class="cards"><div class="card"><h2>ChatGPT Plus</h2><p>适合日常学习、办公与 AI 使用。</p><div class="price">价格待确认</div><button onclick="choose('Plus')">选择 Plus</button></div><div class="card"><h2>ChatGPT Pro</h2><p>适合高强度专业工作需求。</p><div class="price">价格待确认</div><button onclick="choose('Pro')">选择 Pro</button></div></div><div class="notice">独立第三方服务页面，非 OpenAI 官方网站。请勿提交密码、验证码或完整银行卡信息。</div></div></section>
<section id="order"><div class="wrap"><div class="panel" style="max-width:560px;margin:auto"><h2>提交订单</h2><label>套餐</label><select id="plan"><option value="Plus">ChatGPT Plus</option><option value="Pro">ChatGPT Pro</option></select><label>联系方式</label><input id="contact"><label>意向金额（元）</label><input id="amount" type="number"><label>备注</label><textarea id="note"></textarea><button onclick="submitOrder()">提交订单</button><div id="orderMsg" class="msg"></div></div></div></section>
<section id="login"><div class="wrap"><div class="panel" style="max-width:500px;margin:auto"><h2>管理员登录</h2><label>邮箱</label><input id="email" type="email"><label>密码</label><input id="password" type="password"><button onclick="login()">登录</button><div id="loginMsg" class="msg err"></div></div></div></section>
<section id="admin"><div class="wrap"><h2>订单管理后台 <button onclick="logout()">退出登录</button></h2><div class="stats"><div class="panel stat">订单数<b id="count">0</b></div><div class="panel stat">订单金额<b id="revenue">¥0</b></div><div class="panel stat">预计利润<b id="profit">¥0</b></div></div><div class="panel" style="overflow:auto"><table><thead><tr><th>订单号</th><th>套餐</th><th>联系方式</th><th>售价</th><th>成本</th><th>状态</th><th>保存</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://uisbtjozkqnogxshuihw.supabase.co","sb_publishable_Khtnmv7OZ4Hlrd5UP-v0rQ_Oo00HCcd"),$=x=>document.getElementById(x);
function go(id){document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");scrollTo(0,0)}
function choose(p){$("plan").value=p;go("order")}function msg(id,t,c){let x=$(id);x.textContent=t;x.className="msg "+c;x.style.display="block"}
async function submitOrder(){let c=$("contact").value.trim();if(!c)return msg("orderMsg","请填写联系方式","err");let n="CZ"+Date.now().toString().slice(-10),{error}=await db.from("orders").insert({order_no:n,package:$("plan").value,contact:c,amount:Number($("amount").value||0),note:$("note").value});if(error)return msg("orderMsg","提交失败："+error.message,"err");msg("orderMsg","提交成功！订单号："+n,"ok");$("contact").value="";$("amount").value="";$("note").value=""}
async function admin(){let {data}=await db.auth.getSession();if(data.session){go("admin");load()}else go("login")}
async function login(){let {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return msg("loginMsg","登录失败："+error.message,"err");go("admin");load()}
async function logout(){await db.auth.signOut();go("home")}
async function load(){let {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});if(error){$("rows").innerHTML="<tr><td colspan=7>读取失败："+error.message+"</td></tr>";return}let a=data||[],sum=a.reduce((s,o)=>s+Number(o.amount||0),0),p=a.reduce((s,o)=>s+Number(o.amount||0)-Number(o.cost||0),0);$("count").textContent=a.length;$("revenue").textContent="¥"+sum.toFixed(2);$("profit").textContent="¥"+p.toFixed(2);$("rows").innerHTML=a.map(o=>`<tr><td>${o.order_no}</td><td>${o.package}</td><td>${o.contact}</td><td>¥${o.amount}</td><td><input id="c${o.id}" type="number" value="${o.cost||0}"></td><td><select id="s${o.id}"><option value="pending">待处理</option><option value="processing">处理中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></td><td><button onclick="saveOrder(${o.id})">保存</button></td></tr>`).join("");a.forEach(o=>{$("s"+o.id).value=o.status})}
async function saveOrder(id){let {error}=await db.from("orders").update({cost:Number($("c"+id).value||0),status:$("s"+id).value}).eq("id",id);if(error)alert("保存失败："+error.message);else{alert("保存成功");load()}}
</script></body></html>
