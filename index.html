<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>充值中心 - 订单管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#182230}
header{background:#111827;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
.logo{font-size:22px;font-weight:800}.logo span{color:#60a5fa}nav button{background:none;border:0;color:#cbd5e1;margin-left:14px;font-size:15px;cursor:pointer}
.hero{padding:65px 5% 45px;background:linear-gradient(135deg,#111827,#1e3a5f);color:white;text-align:center}.hero h1{font-size:38px;margin:0 0 12px}.hero p{color:#cbd5e1}
.container{max-width:1050px;margin:32px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card,.panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 22px rgba(15,23,42,.07)}.card h3{margin:0 0 10px}.price{font-size:28px;font-weight:800;color:#2563eb;margin:15px 0}
button.primary{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer;width:100%}button.primary:hover{background:#1d4ed8}
section{display:none}section.active{display:block}.form{max-width:560px;margin:auto}.form label{display:block;margin:14px 0 6px;font-weight:600}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;font-size:15px}.form textarea{height:85px}
.notice{font-size:13px;color:#64748b;line-height:1.7;background:#eff6ff;padding:12px;border-radius:9px;margin:15px 0}.result{display:none;margin-top:16px;padding:16px;background:#ecfdf5;border-radius:10px;color:#166534}
.search{display:flex;gap:10px}.search input{flex:1;padding:12px;border:1px solid #d7dce5;border-radius:9px}.search button{width:auto}
.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:12px;border-bottom:1px solid #e8edf3;text-align:left}.badge{padding:5px 9px;border-radius:999px;font-size:12px;background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:20px}.stat b{font-size:26px;display:block;color:#2563eb}.hidden{display:none}
footer{text-align:center;color:#94a3b8;padding:35px;font-size:13px}
@media(max-width:600px){.hero h1{font-size:30px}nav button{margin-left:6px;font-size:13px}.table{font-size:12px}.table th,.table td{padding:8px}}
</style>
</head>
<body>
<header><div class="logo">充值<span>中心</span></div><nav>
<button onclick="show('home')">首页</button><button onclick="show('order')">提交订单</button>
<button onclick="show('query')">订单查询</button><button onclick="adminLogin()">管理后台</button>
</nav></header>

<section id="home" class="active">
<div class="hero"><h1>简单 · 快速 · 透明</h1><p>数字服务订单提交与进度查询平台</p></div>
<div class="container"><h2>选择服务</h2><div class="cards">
<div class="card"><h3>AI 会员服务</h3><p>提交服务订单，由人工确认处理。</p><div class="price">¥ 待设置</div><button class="primary" onclick="choose('AI 会员服务')">立即下单</button></div>
<div class="card"><h3>其他数字服务</h3><p>更多服务项目可由后台随时添加。</p><div class="price">¥ 待设置</div><button class="primary" onclick="choose('其他数字服务')">提交咨询</button></div>
</div></div>
</section>

<section id="order"><div class="container"><div class="panel form">
<h2>提交订单</h2>
<div class="notice">为保护账户安全，请勿在本网站提交账号密码、银行卡完整信息或验证码。订单采用人工确认处理。</div>
<label>服务类型</label><select id="product"><option>AI 会员服务</option><option>其他数字服务</option></select>
<label>联系方式 / 邮箱</label><input id="contact" placeholder="用于联系和订单确认">
<label>订单金额（元）</label><input id="amount" type="number" min="0" placeholder="由客服确认后填写">
<label>订单备注</label><textarea id="note" placeholder="填写套餐或其他需求，不要填写密码和验证码"></textarea>
<button class="primary" onclick="submitOrder()">提交订单</button><div id="result" class="result"></div>
</div></div></section>

<section id="query"><div class="container"><div class="panel form">
<h2>查询订单</h2><div class="search"><input id="queryId" placeholder="请输入订单号"><button class="primary" onclick="queryOrder()">查询</button></div>
<div id="queryResult" class="notice" style="margin-top:16px">订单状态将在这里显示。</div>
</div></div></section>

<section id="admin"><div class="container">
<h2>管理后台</h2><div class="stats">
<div class="panel stat">订单数量<b id="count">0</b></div>
<div class="panel stat">订单金额<b id="revenue">¥0</b></div>
<div class="panel stat">预计利润<b id="profit">¥0</b></div>
</div>
<div class="panel"><table class="table"><thead><tr><th>订单号</th><th>服务</th><th>联系方式</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody id="orders"></tbody></table></div>
<div class="notice">这是本地演示版，数据保存在当前浏览器。正式上线时应接入服务器数据库、身份验证和合规支付服务。</div>
</div></section>
<footer>© 2026 充值中心 · 演示版本</footer>
<script>
let orders=JSON.parse(localStorage.getItem('cz_orders')||'[]');
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='admin')renderAdmin()}
function choose(p){show('order');document.getElementById('product').value=p}
function save(){localStorage.setItem('cz_orders',JSON.stringify(orders))}
function submitOrder(){
 let c=contact.value.trim(), a=Number(amount.value||0), n=note.value.trim();
 if(!c){alert('请填写联系方式');return}
 let id='CZ'+Date.now().toString().slice(-8);
 orders.unshift({id,product:product.value,contact:c,amount:a,note:n,status:'待处理',time:new Date().toLocaleString()});save();
 result.style.display='block';result.innerHTML='订单提交成功！<br>订单号：<b>'+id+'</b><br>请保存订单号用于查询。';
 contact.value='';amount.value='';note.value='';
}
function queryOrder(){let o=orders.find(x=>x.id.toLowerCase()===queryId.value.trim().toLowerCase());queryResult.innerHTML=o?`<b>订单号：${o.id}</b><br>服务：${o.product}<br>状态：<b>${o.status}</b><br>提交时间：${o.time}`:'未找到该订单，请检查订单号。'}
function adminLogin(){let p=prompt('请输入后台密码（演示版默认：admin123）');if(p==='admin123')show('admin');else if(p!==null)alert('密码错误')}
function renderAdmin(){
 count.textContent=orders.length;let total=orders.reduce((s,o)=>s+o.amount,0);revenue.textContent='¥'+total.toFixed(2);profit.textContent='¥'+(total*0.1).toFixed(2);
 orders.innerHTML=orders.map((o,i)=>`<tr><td>${o.id}</td><td>${o.product}</td><td>${o.contact}</td><td>¥${o.amount}</td><td><span class="badge ${o.status==='已完成'?'done':''}">${o.status}</span></td><td><button onclick="finish(${i})">完成</button> <button onclick="del(${i})">删除</button></td></tr>`).join('')||'<tr><td colspan="6">暂无订单</td></tr>';
}
function finish(i){orders[i].status='已完成';save();renderAdmin()}function del(i){if(confirm('确定删除该订单？')){orders.splice(i,1);save();renderAdmin()}}
</script></body></html>
